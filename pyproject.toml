[build-system]
# 77+ understands the SPDX "license" string and "license-files" (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sciproof"
version = "0.7.0"
description = "Record computational experiments and create machine-verifiable evidence for checking their results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alok Pandey", email = "alok_ps2603mth16@iitp.ac.in" },
    { name = "HayagrivAI Labs" },
]
keywords = [
    "reproducibility",
    "reproducible-research",
    "provenance",
    "research",
    "verification",
    "experiment-tracking",
    "checksum",
    "integrity",
    "attestation",
    "ci",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# No runtime dependencies on purpose: the evidence tool should be easy to audit.
dependencies = []

[project.urls]
Homepage = "https://github.com/hayagrivai-labs/sciproof"
Repository = "https://github.com/hayagrivai-labs/sciproof"
Issues = "https://github.com/hayagrivai-labs/sciproof/issues"
Documentation = "https://hayagrivai-labs.github.io/sciproof/"
Changelog = "https://github.com/hayagrivai-labs/sciproof/blob/main/CHANGELOG.md"
Discussions = "https://github.com/hayagrivai-labs/sciproof/discussions"

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
completion = ["argcomplete>=3"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.26", "argcomplete>=3", "hypothesis>=6", "coverage>=7"]

[project.scripts]
sciproof = "sciproof.cli:main"

[project.entry-points.pytest11]
sciproof = "sciproof.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciproof = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use assert and run subprocesses with fixed arguments.
"tests/*" = ["S101", "S603", "S607", "S105", "S106"]
"examples/*" = ["S311"]

[tool.coverage.run]
source = ["src/sciproof"]

[tool.coverage.report]
show_missing = true
